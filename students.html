<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mahasiswa - Graduation Monitor</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    /* Terapkan tema sebelum render supaya tidak ada kedipan (flash of unstyled theme) */
    (function () {
      try {
        var pref = localStorage.getItem("gm-theme") || "system";
        var dark = pref === "dark" ||
          (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
</head>
<body>
  <div class="page-wrap">
    <div class="breadcrumb">
      <a href="dashboard.html">Dashboard</a> &gt; <span class="current">Data Mahasiswa</span>
    </div>

    <header class="page-title">
      <h1>Data Mahasiswa</h1>
      <div class="sub">Daftar lengkap mahasiswa bimbingan</div>
    </header>

    <div id="alert" class="hidden"></div>

    <section class="blue-shell">
      <div class="toolbar">
        <div class="field search" style="min-width:260px;flex:1">
          <input type="text" id="q" placeholder="Cari nama atau NIM..." />
        </div>
        <div class="field" style="min-width:180px">
          <select id="f-semester"><option value="">Semua Semester</option></select>
        </div>
        <div class="field" style="min-width:170px">
          <select id="f-active" aria-label="Filter keaktifan mahasiswa">
            <option value="semua">Keaktifan: Semua</option>
            <option value="aktif">Keaktifan: Aktif</option>
            <option value="nonaktif">Keaktifan: Nonaktif</option>
          </select>
        </div>
      </div>
      <div class="table-shell" style="margin-top:12px; border:none; box-shadow:none; padding:0;">
        <div id="table-host"><div class="spinner" style="border-color:rgba(255,255,255,0.35); border-top-color:#fff;"></div></div>
      </div>
    </section>
  </div>

  <script type="module" src="js/students.js"></script>
</body>
</html>
