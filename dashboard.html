<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Mahasiswa Bimbingan - Graduation Monitor</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    /* Terapkan tema sebelum render supaya tidak ada kedipan (flash of unstyled theme) */
    (function () {
      try {
        var pref = localStorage.getItem("gm-theme") || "system";
        var dark = pref === "dark" ||
          (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
</head>
<body>
  <div class="page-wrap">
    <header class="page-title">
      <h1>Dashboard Mahasiswa Bimbingan</h1>
      <div class="sub">Memuat data...</div>
    </header>

    <div id="alert" class="hidden"></div>

    <section class="grid cols-4 mb-24" id="kpi-row">
      <div class="figma-card stat-card stat-card--total">
        <div class="k-icon brown">👥</div>
        <div class="kpi">
          <div class="k-value" id="k-total">-</div>
          <div class="k-label">Total Mahasiswa</div>
        </div>
      </div>
      <div class="figma-card stat-card stat-card--danger">
        <div class="k-icon red">⚠️</div>
        <div class="kpi">
          <div class="k-value" id="k-danger">-</div>
          <div class="k-label">Mendesak</div>
        </div>
      </div>
      <div class="figma-card stat-card stat-card--warn">
        <div class="k-icon amber">ℹ️</div>
        <div class="kpi">
          <div class="k-value" id="k-warn">-</div>
          <div class="k-label">Perlu Perhatian</div>
        </div>
      </div>
      <div class="figma-card stat-card stat-card--safe">
        <div class="k-icon green">✓</div>
        <div class="kpi">
          <div class="k-value" id="k-safe">-</div>
          <div class="k-label">Aman</div>
        </div>
      </div>
    </section>

    <section class="blue-shell mb-24">
      <div class="toolbar">
        <div class="field search" style="min-width:300px; flex:1">
          <input type="text" id="q" placeholder="Cari nama atau NIM..." />
        </div>
        <div class="field" style="min-width:180px">
          <select id="f-semester"><option value="">Semua Semester</option></select>
        </div>
        <div class="field" style="min-width:180px">
          <select id="f-status">
            <option value="">Semua Status</option>
            <option value="danger">Mendesak</option>
            <option value="warn">Perlu Perhatian</option>
            <option value="safe">Aman</option>
          </select>
        </div>
        <div class="field" style="min-width:170px">
          <select id="f-active" aria-label="Filter keaktifan mahasiswa">
            <option value="semua">Keaktifan: Semua</option>
            <option value="aktif">Keaktifan: Aktif</option>
            <option value="nonaktif">Keaktifan: Nonaktif</option>
          </select>
        </div>
        <div class="field" style="min-width:200px">
          <select id="f-sort" aria-label="Urutkan daftar mahasiswa">
            <option value="risk">Urutkan: Risiko tertinggi</option>
            <option value="name">Urutkan: Nama (A-Z)</option>
            <option value="semester">Urutkan: Semester</option>
            <option value="nim">Urutkan: NIM</option>
            <option value="sks">Urutkan: SKS paling kritis</option>
            <option value="comserv">Urutkan: Comserv paling kritis</option>
            <option value="sat">Urutkan: SAT paling kritis</option>
            <option value="belingua">Urutkan: Belingua paling kritis</option>
            <option value="sertifikasi">Urutkan: Sertifikasi paling kritis</option>
          </select>
        </div>
      </div>
      <div class="count-row">
        <div class="small" id="count-label">0 mahasiswa bimbingan ditemukan</div>
      </div>
    </section>

    <div id="bulk-bar" class="bulk-bar hidden" aria-live="polite"></div>

    <div class="table-shell">
      <div id="table-host">
        <div class="spinner"></div>
      </div>
    </div>

    <div class="flex center gap-8 mt-24" style="justify-content:center; color: var(--text-muted); font-size: 12px; font-weight: 500;">
      <span>ℹ️</span>
      <span>Klik baris mahasiswa untuk melihat detail. Centang beberapa mahasiswa untuk menonaktifkannya dari pemantauan.</span>
    </div>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
