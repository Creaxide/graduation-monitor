<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Mahasiswa Bimbingan - Graduation Monitor</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="page-wrap">
    <header class="page-title">
      <h1>Dashboard Mahasiswa Bimbingan</h1>
      <div class="sub">Memuat data...</div>
    </header>

    <div id="alert" class="hidden"></div>
    <div id="dummy-banner" class="alert info hidden"></div>

    <section class="grid cols-4 mb-24" id="kpi-row">
      <div class="figma-card stat-card">
        <div class="k-icon brown">👥</div>
        <div class="kpi">
          <div class="k-value" id="k-total">-</div>
          <div class="k-label">Total Mahasiswa</div>
        </div>
      </div>
      <div class="figma-card stat-card">
        <div class="k-icon red">⚠️</div>
        <div class="kpi">
          <div class="k-value" id="k-danger">-</div>
          <div class="k-label">Mendesak</div>
        </div>
      </div>
      <div class="figma-card stat-card">
        <div class="k-icon amber">ℹ️</div>
        <div class="kpi">
          <div class="k-value" id="k-warn">-</div>
          <div class="k-label">Perlu Perhatian</div>
        </div>
      </div>
      <div class="figma-card stat-card">
        <div class="k-icon green">✓</div>
        <div class="kpi">
          <div class="k-value" id="k-safe">-</div>
          <div class="k-label">Aman</div>
        </div>
      </div>
    </section>

    <section class="blue-shell mb-24">
      <div class="toolbar">
        <div class="field search" style="min-width:300px; flex:1">
          <input type="text" id="q" placeholder="Cari nama atau NIM..." />
        </div>
        <div class="field" style="min-width:180px">
          <select id="f-semester"><option value="">Semua Semester</option></select>
        </div>
        <div class="field" style="min-width:180px">
          <select id="f-status">
            <option value="">Semua Status</option>
            <option value="danger">Mendesak</option>
            <option value="warn">Perlu Perhatian</option>
            <option value="safe">Aman</option>
          </select>
        </div>
        <div class="small fw-700" style="margin-bottom:12px; color:rgba(255,255,255,0.9)" id="count-label">
          0 mahasiswa bimbingan ditemukan
        </div>
      </div>
    </section>

    <div class="table-shell">
      <div class="flex gap-8 wrap mb-16 no-print" id="test-controls" style="justify-content:flex-start;">
        <span class="small" id="dummy-note" style="align-self:center; color:rgba(255,255,255,0.85);"></span>
      </div>
      <div id="table-host">
        <div class="spinner"></div>
      </div>
    </div>

    <div class="flex center gap-8 mt-24" style="justify-content:center; color: #64708a; font-size: 12px; font-weight: 500;">
      <span>ℹ️</span>
      <span>Klik baris mahasiswa untuk melihat detail dan rekomendasi prioritas kelulusan.</span>
    </div>

    <!-- Floating Tools (Optional/Support) -->
    <div style="position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:10px; z-index:50;">
       <button class="btn amber hidden" id="add-student-btn">+ Tambah Mahasiswa</button>
       <div id="sidebar-tools"></div> <!-- Container for dummy tools box -->
    </div>
  </div>

  <div class="modal-backdrop" id="add-modal">
    <div class="modal">
      <div class="modal-head">
        <h2>Tambah data dummy</h2>
        <button class="x" id="add-close" type="button">&times;</button>
      </div>
      <form id="add-form">
        <div class="grid cols-2" style="gap:0 14px">
          <div class="field"><label for="a-name">Nama</label><input type="text" id="a-name" required /></div>
          <div class="field"><label for="a-nim">NIM</label><input type="text" id="a-nim" placeholder="otomatis jika kosong" /></div>
          <div class="field"><label for="a-program">Program</label>
            <select id="a-program"><option value="prog-cs">Computer Science</option><option value="prog-is">Information Systems</option></select></div>
          <div class="field"><label for="a-semester">Semester</label><input type="number" id="a-semester" min="1" max="14" value="6" /></div>
          <div class="field"><label for="a-sks">Total SKS lulus</label><input type="number" id="a-sks" min="0" value="90" /></div>
          <div class="field"><label for="a-comserv">Jam Comserv</label><input type="number" id="a-comserv" min="0" value="10" /></div>
          <div class="field"><label for="a-sat">Poin SAT</label><input type="number" id="a-sat" min="0" value="10" /></div>
          <div class="field"><label for="a-belingua">Status Belingua</label>
            <select id="a-belingua"><option value="belum_ambil">Belum ambil</option><option value="proses">Proses</option><option value="lulus">Lulus</option></select></div>
        </div>
        <div class="flex gap-8" style="justify-content:flex-end; margin-top: 10px;">
          <button type="button" class="btn" id="add-cancel">Batal</button>
          <button type="submit" class="btn primary">Simpan & Lihat Detail</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
