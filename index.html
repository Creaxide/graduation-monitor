<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk - Sistem Monitoring Kelulusan</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header site-header--slim">
    <div class="header-inner">
      <div class="binus-logo-wrap">
        <img class="binus-logo" src="https://media.neliti.com/media/organisations/logo-219-binus.png" alt="BINUS University" />
        <div class="binus-brand-label">
          <span>BINUS UNIVERSITY</span>
          <span>School of Computer Science</span>
        </div>
      </div>
    </div>
  </header>

  <main class="login-screen">
    <div id="alert" class="hidden" style="max-width:330px; margin:0 auto 14px;"></div>

    <h1 class="login-title">Sistem Monitoring Kelulusan</h1>
    <p class="login-sub">Masuk dengan akun Binus Anda</p>

    <div class="login-card">
      <form id="login-form">
        <div class="field">
          <label for="email">Email Binus</label>
          <input type="email" id="email" autocomplete="username" placeholder="nama@binus.ac.id" required />
        </div>
        <div class="field" style="margin-bottom: 18px;">
          <label for="password">Kata Sandi</label>
          <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-login" id="submit-btn">Masuk</button>
      </form>
    </div>

    <div class="login-card login-card--demo">
      <div class="demo-title">AKUN DEMO</div>
      <div class="demo-row">
        <span class="demo-mail">dosen@binus.ac.id</span>
        <span class="demo-pill">Dosen AA</span>
      </div>
      <div class="demo-row">
        <span class="demo-mail">kaprodi@binus.ac.id</span>
        <span class="demo-pill">Kaprodi</span>
      </div>
    </div>
  </main>

  <script type="module">
    import { getSession, signIn, isMock } from "./js/data.js";
    import { setBusy } from "./js/utils.js";

    const form = document.getElementById("login-form");
    const alertBox = document.getElementById("alert");

    function showAlert(message, type = "error") {
      alertBox.className = `alert ${type}`;
      alertBox.style.maxWidth = "330px";
      alertBox.style.margin = "0 auto 14px";
      alertBox.textContent = message;
    }

    if (isMock) {
      document.getElementById("email").value = "dosen@binus.ac.id";
      document.getElementById("password").value = "demo1234";
    }

    (async () => {
      const session = await getSession();
      if (session && session.user) window.location.replace("dashboard.html");
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.classList.add("hidden");
      const btn = document.getElementById("submit-btn");
      setBusy(btn, true, "Memproses...");
      try {
        await signIn(
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
        window.location.replace("dashboard.html");
      } catch (err) {
        showAlert(err.message || "Gagal masuk. Periksa kembali kredensial Anda.");
        setBusy(btn, false);
      }
    });
  </script>
</body>
</html>
