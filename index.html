<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1596c9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Masuk - Sistem Monitoring Kelulusan</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/app-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    /* Terapkan tema sebelum render supaya tidak ada kedipan (flash of unstyled theme) */
    (function () {
      try {
        var pref = localStorage.getItem("gm-theme") || "system";
        var dark = pref === "dark" ||
          (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <script src="./js/pwa.js?v=install-2" defer></script>
</head>
<body>
  <header class="site-header site-header--slim">
    <div class="header-inner">
      <a class="binus-logo-wrap" href="dashboard.html" aria-label="Buka dashboard Graduation Monitor">
        <span class="binus-logo-box" role="img" aria-label="BINUS University">
          <img class="binus-logo binus-logo--light" src="Binusian_logolightmode.png" alt="" />
          <img class="binus-logo binus-logo--dark" src="Binusian_logodarkmode.png" alt="" />
        </span>
        <div class="binus-brand-label">
          <span>School of Computer Science</span>
        </div>
      </a>
      <div class="header-spacer"></div>
      <button class="btn-theme" id="theme-btn" type="button" title="Ganti tema terang/gelap" aria-label="Ganti tema terang/gelap"></button>
    </div>
  </header>

  <main class="login-screen">
    <div id="alert" class="hidden" style="max-width:380px; margin:0 auto 16px;"></div>

    <h1 class="login-title">Sistem Monitoring Kelulusan</h1>
    <p class="login-sub">Masuk dengan akun Binus Anda</p>

    <div class="login-card">
      <p class="login-hint">Gunakan akun kampus BINUS (<strong>@binus.ac.id</strong>)</p>

      <form id="login-form">
        <div class="field">
          <label for="email">Email Binus</label>
          <input type="email" id="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="nama@binus.ac.id" required />
        </div>
        <div class="field" style="margin-bottom: 18px;">
          <label for="password">Kata Sandi</label>
          <div class="password-wrap">
            <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required />
            <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Tampilkan kata sandi" aria-pressed="false" title="Tampilkan kata sandi">
              <svg class="pw-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="pw-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-login" id="submit-btn">Masuk</button>
      </form>
    </div>
  </main>

  <script type="module">
    import { getProfile, getSession, signIn, signOut } from "./js/data.js";
    import { accessDenialReason, setBusy } from "./js/utils.js";
    import { initTheme, mountThemeToggle } from "./js/theme.js";

    initTheme();
    mountThemeToggle("theme-btn");

    // Toggle tampilkan/sembunyikan kata sandi (memudahkan pengetikan di HP).
    const pwInput = document.getElementById("password");
    const pwToggle = document.getElementById("pw-toggle");
    if (pwInput && pwToggle) {
      pwToggle.addEventListener("click", () => {
        const show = pwInput.type === "password";
        pwInput.type = show ? "text" : "password";
        pwToggle.setAttribute("aria-pressed", String(show));
        pwToggle.setAttribute("aria-label", show ? "Sembunyikan kata sandi" : "Tampilkan kata sandi");
        pwToggle.title = show ? "Sembunyikan kata sandi" : "Tampilkan kata sandi";
        pwToggle.querySelector(".pw-eye")?.toggleAttribute("hidden", show);
        pwToggle.querySelector(".pw-eye-off")?.toggleAttribute("hidden", !show);
        pwInput.focus({ preventScroll: true });
      });
    }

    const form = document.getElementById("login-form");
    const alertBox = document.getElementById("alert");

    const DENIAL_MESSAGES = {
      no_access:
        "Akun Anda belum memiliki akses ke sistem ini. Hubungi admin program agar didaftarkan sebagai Dosen AA atau Kaprodi.",
      no_session: "Sesi login tidak ditemukan. Silakan masuk kembali.",
    };

    function showAlert(message, type = "error") {
      alertBox.className = `alert ${type}`;
      alertBox.style.maxWidth = "380px";
      alertBox.style.margin = "0 auto 16px";
      alertBox.textContent = message;
    }

    async function routeToApp(session) {
      if (!navigator.onLine) {
        showAlert("Aplikasi terbuka offline, tetapi verifikasi akun dan data mahasiswa memerlukan koneksi internet.", "info");
        return;
      }
      const profile = await getProfile(session.user.id);
      const denial = accessDenialReason(session.user, profile);
      if (denial) {
        await signOut();
        showAlert(DENIAL_MESSAGES[denial]);
        return;
      }
      window.location.replace("dashboard.html");
    }

    (async () => {
      const session = await getSession();
      if (!session || !session.user) return;
      await routeToApp(session);
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.classList.add("hidden");
      const btn = document.getElementById("submit-btn");
      setBusy(btn, true, "Memproses...");
      try {
        const { user } = await signIn(
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
        const profile = await getProfile(user.id);
        const denial = accessDenialReason(user, profile);
        if (denial) {
          await signOut();
          showAlert(DENIAL_MESSAGES[denial]);
          setBusy(btn, false);
          return;
        }
        window.location.replace("dashboard.html");
      } catch (err) {
        showAlert(err.message || "Gagal masuk. Periksa kembali kredensial Anda.");
        setBusy(btn, false);
      }
    });
  </script>
</body>
</html>
